# bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
# bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
# bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
# bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
# bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Single click to clear selection (without exiting copy-mode, so click-drag can still select)
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection

# Double LMB Select & Copy (Word)
# unbind-key DoubleClick1Pane
bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word \; \
    send-keys -X copy-selection-and-cancel
bind-key -n DoubleClick1Pane \
    select-pane \; \
    copy-mode -M \; \
    send-keys -X select-word \; \
    send-keys -X copy-selection-and-cancel

# Triple LMB: Select & Copy (Line)
# unbind-key TripleClick1Pane
bind-key -T copy-mode-vi TripleClick1Pane \
    select-pane \; \
    send-keys -X select-line \; \
    send-keys -X copy-selection-and-cancel
bind-key -n TripleClick1Pane \
    select-pane \; \
    copy-mode -M \; \
    send-keys -X select-line \; \
    send-keys -X copy-selection-and-cancel

# Drag and Drop Select & Copy (Selection) - stay in copy-mode after copying
bind-key -T copy-mode-vi MouseDragEnd1Pane \
	send-keys -X copy-selection

# Middle click to paste from the tmux buffer
unbind-key MouseDown2Pane
bind-key -n MouseDown2Pane paste-buffer -p

# Shift insert to paste from the tmux buffer
unbind-key S-IC
bind-key S-IC paste-buffer -p

# Enter to cancel selection
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter \
	send -X cancel

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
